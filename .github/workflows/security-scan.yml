name: "Security Auditing & Test Suite"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: "NPM Audit & Secret Scanning"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: NPM Dependency Vulnerability Audit
      run: npm audit --audit-level=high

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Run Test Suite & Security Assertions
      run: npm test
